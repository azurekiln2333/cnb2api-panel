# GitLab pipeline. Mirrors the CNB and GitHub pipelines: an independent build
# with its own Release and container image.
#
# Required CI/CD variables (Settings > CI/CD > Variables):
#   CI_REGISTRY_USER / CI_REGISTRY_PASSWORD  preconfigured by GitLab
#   CI_REGISTRY_IMAGE                        preconfigured by GitLab
#
# Each publishing platform builds independently, so archives for the same
# version can differ in bytes and SHA-256.

stages:
  - test
  - package
  - release
  - image

default:
  image: node:26.12.1-bookworm
  cache:
    key:
      files:
        - web/package-lock.json
    paths:
      - web/node_modules/
      - web/.cache/ms-playwright/

backend-test:
  stage: test
  script:
    - bash scripts/ci-backend.sh

console:
  stage: package
  needs: [backend-test]
  script:
    - bash scripts/ci-console.sh | tee ci-console.out
    - grep -E '^(archive|version)=' ci-console.out > ci-console.env
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - dist/
      - ci-console.env
      - test-results/browser/
    reports:
      dotenv: ci-console.env

publish-release:
  stage: release
  needs: [console]
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
  script:
    - |
      set -euo pipefail
      cd dist
      sha256sum --check "$ARCHIVE.sha256"
      echo "verified $ARCHIVE"
  release:
    tag_name: '$CI_COMMIT_TAG'
    name: 'cnb2api-panel $CI_COMMIT_TAG'
    description: |
      Built at: $CI_JOB_STARTED_AT (UTC)

      Package: $ARCHIVE

      Each publishing platform builds independently, so archives for the same
      version can differ in bytes and SHA-256. Verify the checksum that ships
      beside your downloaded archive.
    assets:
      links:
        - name: '$ARCHIVE'
          url: '$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/dist/$ARCHIVE?job=console'
        - name: '$ARCHIVE.sha256'
          url: '$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/dist/$ARCHIVE.sha256?job=console'

publish-image:
  stage: image
  needs: [console]
  image: docker:27-cli
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: '/certs'
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
  script:
    - |
      set -euo pipefail
      TAG="$CI_COMMIT_TAG"
      VERSION=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' package.json | head -1)
      if [ "$TAG" != "v$VERSION" ]; then
        echo "Release tag must be v$VERSION, received $TAG" >&2
        exit 1
      fi
      IMAGE="$CI_REGISTRY_IMAGE"
      echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
      docker build -t "$IMAGE:$TAG" .
      docker push "$IMAGE:$TAG"
      case "$VERSION" in
        *-*) echo "prerelease $VERSION, latest tag skipped" ;;
        *)
          docker tag "$IMAGE:$TAG" "$IMAGE:latest"
          docker push "$IMAGE:latest"
          ;;
      esac
      echo "pushed $IMAGE:$TAG"
