services:
  panel:
    image: "${PANEL_IMAGE:-docker.cnb.cool/azurekiln/cnb2api-panel:latest}"
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      # Keep container settings independent of an existing plain Node .env.
      PANEL_HOST: 0.0.0.0
      PANEL_PORT: "9002"
      PANEL_DATA_DIR: /app/data
      PANEL_LOG_DIR: /app/logs
    ports:
      - "${PANEL_BIND_HOST:-127.0.0.1}:${PANEL_PORT:-9002}:9002"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      com.centurylinklabs.watchtower.scope: "${COMPOSE_PROJECT_NAME:-cnb2api-panel}"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  watchtower:
    image: nickfedor/watchtower:1.23.2
    restart: unless-stopped
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_SCOPE: "${COMPOSE_PROJECT_NAME:-cnb2api-panel}"
      WATCHTOWER_POLL_INTERVAL: "${WATCHTOWER_POLL_INTERVAL:-600}"
      WATCHTOWER_CLEANUP: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    labels:
      com.centurylinklabs.watchtower.enable: "false"
      com.centurylinklabs.watchtower.scope: "${COMPOSE_PROJECT_NAME:-cnb2api-panel}"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
