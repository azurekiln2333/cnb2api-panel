# Host Nginx: replace ai.example.com and certificate paths.
# The console, /v1/*, /register and /ops/register all use the same gateway.
# If old exact registration locations exist, replace their proxy_pass target
# with http://127.0.0.1:9002 or remove them so location / below handles them.
server {
    listen 443 ssl;
    server_name ai.example.com;
    ssl_certificate /etc/letsencrypt/live/ai.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai.example.com/privkey.pem;

    client_max_body_size 4m;
    location / {
        proxy_pass http://127.0.0.1:9002;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # Preserve the panel's JSON error details instead of replacing them with HTML.
        proxy_intercept_errors off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }
}

server {
    listen 80;
    server_name ai.example.com;
    return 301 https://$host$request_uri;
}
