name: Build and release

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

# The backend and console stages are shared scripts. Keep them in separate jobs
# so they still run in parallel; scripts/ci-backend.sh and scripts/ci-console.sh
# are also used by the CNB, GitLab, GitCode and Gitee pipelines.
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: bash scripts/ci-backend.sh

  console:
    runs-on: ubuntu-24.04
    outputs:
      archive: ${{ steps.package.outputs.archive }}
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build, test and package console
        id: package
        run: |
          set -euo pipefail
          bash scripts/ci-console.sh | tee /tmp/ci-console.out
          # Re-publish the script's key=value lines as GitHub step outputs.
          grep -E '^(archive|version)=' /tmp/ci-console.out >> "$GITHUB_OUTPUT"
      - name: Upload release package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.archive }}
          path: |
            dist/${{ steps.package.outputs.archive }}
            dist/${{ steps.package.outputs.archive }}.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Upload browser failure details
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-failure-${{ github.run_id }}
          path: test-results/browser/
          if-no-files-found: ignore
          retention-days: 7

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [test, console]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.console.outputs.archive }}
          path: dist
      - name: Verify package and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.console.outputs.version }}
          RELEASE_ARCHIVE: ${{ needs.console.outputs.archive }}
        run: |
          cd dist
          sha256sum --check "$RELEASE_ARCHIVE.sha256"
          notes=$(printf '%s\n' \
            'Each publishing platform builds independently, so archives for the same' \
            'version can differ in bytes and SHA-256. Verify the checksum that ships' \
            'beside your downloaded archive.')
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$RELEASE_ARCHIVE" "$RELEASE_ARCHIVE.sha256" --clobber
          else
            # Notes are passed explicitly because --generate-notes cannot be
            # combined with --notes; --verify-tag keeps the tag check.
            release_flags=(--notes "$notes")
            if [[ "$RELEASE_VERSION" == *-* ]]; then
              release_flags+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" "$RELEASE_ARCHIVE" "$RELEASE_ARCHIVE.sha256" \
              --verify-tag --title "cnb2api-panel v$RELEASE_VERSION" "${release_flags[@]}"
          fi

  image:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [test, console]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Resolve image tags
        id: meta
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="${RELEASE_TAG#v}"
          tags=$(printf '%s' "$image:$RELEASE_TAG")
          if [ "${version#*-}" = "$version" ]; then
            tags=$(printf '%s\n%s' "$tags" "$image:latest")
          fi
          {
            echo "image=$image"
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
